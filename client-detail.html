<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Details - AI DataFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <nav class="dashboard-nav">
        <div class="nav-brand">
            <div class="logo-icon">
                <span class="logo-ai-small">AI</span>
            </div>
            <span class="logo-dataflow-nav">DataFlow</span>
        </div>
        
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="recommendations.html" class="nav-link">
                <i class="fas fa-lightbulb"></i> New Analysis
            </a>
            <a href="clients.html" class="nav-link active">
                <i class="fas fa-users"></i> Clients
            </a>
            <a href="history.html" class="nav-link">
                <i class="fas fa-history"></i> History
            </a>
        </div>
        
        <div class="nav-user">
            <div class="user-info">
                <span id="userName">User</span>
                <i class="fas fa-user-circle"></i>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <main class="dashboard-content">
        <div class="breadcrumb">
            <a href="clients.html"><i class="fas fa-users"></i> Clients</a>
            <i class="fas fa-chevron-right"></i>
            <span id="breadcrumbClient">Client Details</span>
        </div>
        
        <div id="clientDetails">
            <!-- Client details will be loaded here -->
        </div>
        
        <div id="clientAnalyses" style="margin-top: 40px;">
            <div class="section-header">
                <h2><i class="fas fa-lightbulb"></i> Client Analyses</h2>
                <button id="newAnalysisBtn" class="btn-primary" style="width: auto;">
                    <i class="fas fa-plus-circle"></i> New Analysis for Client
                </button>
            </div>
            
            <div id="analysesList">
                <!-- Analyses will be loaded here -->
            </div>
            
            <div id="noAnalyses" class="empty-state" style="display: none;">
                <i class="fas fa-lightbulb"></i>
                <h3>No Analyses Yet</h3>
                <p>Create the first AI-powered analysis for this client</p>
                <button id="newAnalysisBtnEmpty" class="btn-primary">
                    <i class="fas fa-plus-circle"></i> Create First Analysis
                </button>
            </div>
        </div>
    </main>
    
    <script src="js/auth.js"></script>
    <script src="js/client-detail.js"></script>
</body>
</html>
