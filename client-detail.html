<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Details - AI DataFlow</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <nav class="dashboard-nav">
        <a href="dashboard.html" class="nav-brand" aria-label="AI.DataFlow dashboard">
            <img src="images/logo-horizontal.png" alt="AI.DataFlow" class="nav-logo">
        </a>
        
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="recommendations.html" class="nav-link" data-roles="admin,consultant" hidden>
                <i class="fas fa-lightbulb"></i> New Analysis
            </a>
            <a href="clients.html" class="nav-link active">
                <i class="fas fa-users"></i> Clients
            </a>
            <a href="history.html" class="nav-link">
                <i class="fas fa-history"></i> History
            </a>
            <a href="team.html" class="nav-link" data-roles="admin" hidden>
                <i class="fas fa-user-shield"></i> Team
            </a>
        </div>
        
        <div class="nav-user">
            <div class="user-info">
                <span id="userName">User</span>
                <span class="role-chip" id="roleChip"></span>
                <i class="fas fa-user-circle"></i>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <main class="dashboard-content">
        <div class="breadcrumb">
            <a href="clients.html"><i class="fas fa-users"></i> Clients</a>
            <i class="fas fa-chevron-right"></i>
            <span id="breadcrumbClient">Client Details</span>
        </div>
        
        <div id="clientDetails">
            <!-- Client details will be loaded here -->
        </div>

        <div id="pipelinePanel">
            <!-- Stage, consultant and appointment -->
        </div>

        <div id="timelinePanel" class="timeline-panel" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-comments"></i> Notes &amp; activity</h2>
            </div>
            <div class="timeline-composer">
                <textarea id="noteInput" rows="3" maxlength="2000" placeholder="Add a note the whole team can see: what the client said, what was agreed, what to do next..."></textarea>
                <button id="addNoteBtn" class="btn-primary" style="width: auto;">
                    <i class="fas fa-plus-circle"></i> Add note
                </button>
            </div>
            <p class="timeline-hint"><i class="fas fa-lock"></i> Internal only. Notes are never printed in the client PDF.</p>
            <div id="timelineList" class="timeline-list"></div>
        </div>
        
        <div id="clientAnalyses" style="margin-top: 40px;">
            <div class="section-header">
                <h2><i class="fas fa-lightbulb"></i> Client Analyses</h2>
                <button id="newAnalysisBtn" class="btn-primary" style="width: auto;" data-roles="admin,consultant" hidden>
                    <i class="fas fa-plus-circle"></i> New Analysis for Client
                </button>
            </div>
            
            <div id="analysesList">
                <!-- Analyses will be loaded here -->
            </div>
            
            <div id="noAnalyses" class="empty-state" style="display: none;">
                <i class="fas fa-lightbulb"></i>
                <h3>No Analyses Yet</h3>
                <p id="noAnalysesText">Create the first AI-powered analysis for this client</p>
                <button id="newAnalysisBtnEmpty" class="btn-primary" data-roles="admin,consultant" hidden>
                    <i class="fas fa-plus-circle"></i> Create First Analysis
                </button>
            </div>
        </div>
    </main>
    
    <script src="js/auth.js"></script>
    <script src="js/workspace.js"></script>
    <script src="js/client-detail.js"></script>
</body>
</html>
