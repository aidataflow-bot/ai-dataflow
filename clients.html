<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - AI DataFlow</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <nav class="dashboard-nav">
        <a href="dashboard.html" class="nav-brand" aria-label="AI.DataFlow dashboard">
            <img src="images/logo-horizontal.png" alt="AI.DataFlow" class="nav-logo">
        </a>
        
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="recommendations.html" class="nav-link" data-roles="admin,consultant" hidden>
                <i class="fas fa-lightbulb"></i> New Analysis
            </a>
            <a href="clients.html" class="nav-link active">
                <i class="fas fa-users"></i> Clients
            </a>
            <a href="history.html" class="nav-link">
                <i class="fas fa-history"></i> History
            </a>
            <a href="team.html" class="nav-link" data-roles="admin" hidden>
                <i class="fas fa-user-shield"></i> Team
            </a>
        </div>
        
        <div class="nav-user">
            <div class="user-info">
                <span id="userName">User</span>
                <span class="role-chip" id="roleChip"></span>
                <i class="fas fa-user-circle"></i>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <main class="dashboard-content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-users"></i> Client Management</h1>
                <p class="page-subtitle">Your agency&rsquo;s shared client list: pipeline stage, appointments and who owns each client</p>
            </div>
            <button id="addClientBtn" class="btn-primary" style="width: auto;">
                <i class="fas fa-plus-circle"></i> Add New Client
            </button>
        </div>
        
        <div class="clients-filters">
            <div class="filter-group">
                <label for="filterStage">
                    <i class="fas fa-stream"></i> Stage:
                </label>
                <select id="filterStage">
                    <option value="all">All Stages</option>
                    <option value="lead">Lead</option>
                    <option value="appointment-set">Appointment set</option>
                    <option value="discovery">Discovery</option>
                    <option value="analysis">Analysis</option>
                    <option value="proposal-sent">Proposal sent</option>
                    <option value="won">Won</option>
                    <option value="lost">Lost</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterAssigned">
                    <i class="fas fa-user-tie"></i> Assigned to:
                </label>
                <select id="filterAssigned">
                    <option value="all">Everyone</option>
                    <option value="me">Me</option>
                    <option value="none">Unassigned</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterStatus">
                    <i class="fas fa-filter"></i> Status:
                </label>
                <select id="filterStatus">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="prospect">Prospect</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filterIndustry">
                    <i class="fas fa-industry"></i> Industry:
                </label>
                <select id="filterIndustry">
                    <option value="all">All Industries</option>
                    <option value="technology">Technology</option>
                    <option value="manufacturing">Manufacturing</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="finance">Finance</option>
                    <option value="retail">Retail</option>
                    <option value="real-estate">Real Estate</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="filter-group" style="flex: 1;">
                <label for="searchClients">
                    <i class="fas fa-search"></i> Search:
                </label>
                <input type="text" id="searchClients" placeholder="Search by company or contact name...">
            </div>
        </div>
        
        <div id="clientsContainer">
            <div id="clientsGrid" class="clients-grid">
                <!-- Clients will be loaded here -->
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-users"></i>
                <h3>No Clients Yet</h3>
                <p>Start by adding your first client to track their analyses</p>
                <button id="addClientBtnEmpty" class="btn-primary">
                    <i class="fas fa-plus-circle"></i> Add Your First Client
                </button>
            </div>
        </div>
    </main>
    
    <!-- Add/Edit Client Modal -->
    <div id="clientModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Client</h2>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="clientForm" class="recommendation-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="companyName">
                                <i class="fas fa-building"></i> Company Name *
                            </label>
                            <input type="text" id="companyName" name="companyName" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="contactName">
                                <i class="fas fa-user"></i> Contact Name *
                            </label>
                            <input type="text" id="contactName" name="contactName" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i> Email *
                            </label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">
                                <i class="fas fa-phone"></i> Phone
                            </label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="industry">
                                <i class="fas fa-industry"></i> Industry *
                            </label>
                            <select id="industry" name="industry" required>
                                <option value="">Select industry...</option>
                                <option value="technology">Technology</option>
                                <option value="manufacturing">Manufacturing</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="finance">Finance</option>
                                <option value="retail">Retail</option>
                                <option value="real-estate">Real Estate</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="companySize">
                                <i class="fas fa-users"></i> Company Size
                            </label>
                            <select id="companySize" name="companySize">
                                <option value="">Select size...</option>
                                <option value="1-50">1-50 employees</option>
                                <option value="51-200">51-200 employees</option>
                                <option value="201-500">201-500 employees</option>
                                <option value="501-1000">501-1000 employees</option>
                                <option value="1000+">1000+ employees</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="location">
                                <i class="fas fa-map-marker-alt"></i> Location
                            </label>
                            <input type="text" id="location" name="location" placeholder="City, State/Country">
                        </div>
                        
                        <div class="form-group">
                            <label for="status">
                                <i class="fas fa-flag"></i> Status *
                            </label>
                            <select id="status" name="status" required>
                                <option value="prospect">Prospect</option>
                                <option value="active" selected>Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    

                    <div class="form-section-title"><i class="fas fa-handshake"></i> Pipeline &amp; hand-off</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="stage">
                                <i class="fas fa-stream"></i> Stage
                            </label>
                            <select id="stage" name="stage"></select>
                        </div>

                        <div class="form-group">
                            <label for="assignedTo">
                                <i class="fas fa-user-tie"></i> Assigned consultant
                            </label>
                            <select id="assignedTo" name="assignedTo"></select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="appointmentAt">
                                <i class="fas fa-calendar-check"></i> Appointment (your time zone)
                            </label>
                            <input type="datetime-local" id="appointmentAt" name="appointmentAt">
                        </div>

                        <div class="form-group">
                            <label for="appointmentNotes">
                                <i class="fas fa-comment-dots"></i> Appointment notes
                            </label>
                            <input type="text" id="appointmentNotes" name="appointmentNotes" maxlength="500" placeholder="Zoom link, what they want to cover...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">
                            <i class="fas fa-sticky-note"></i> Background notes
                        </label>
                        <textarea id="notes" name="notes" rows="4" placeholder="Additional information about this client..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="cancelBtn" class="btn-secondary">Cancel</button>
                <button id="saveClientBtn" class="btn-primary">
                    <i class="fas fa-save"></i> Save Client
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/workspace.js"></script>
    <script src="js/clients.js"></script>
</body>
</html>
