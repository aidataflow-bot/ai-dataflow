<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - AI DataFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <nav class="dashboard-nav">
        <div class="nav-brand">
            <div class="logo-icon">
                <span class="logo-ai-small">AI</span>
            </div>
            <span class="logo-dataflow-nav">DataFlow</span>
        </div>
        
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="recommendations.html" class="nav-link">
                <i class="fas fa-lightbulb"></i> New Analysis
            </a>
            <a href="clients.html" class="nav-link">
                <i class="fas fa-users"></i> Clients
            </a>
            <a href="history.html" class="nav-link active">
                <i class="fas fa-history"></i> History
            </a>
        </div>
        
        <div class="nav-user">
            <div class="user-info">
                <span id="userName">User</span>
                <i class="fas fa-user-circle"></i>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <main class="dashboard-content">
        <div class="page-header">
            <h1><i class="fas fa-history"></i> Recommendation History</h1>
            <p class="page-subtitle">Review your past analyses and track implementation progress</p>
        </div>
        
        <div class="history-filters">
            <div class="filter-group">
                <label for="filterArea">
                    <i class="fas fa-filter"></i> Filter by Area:
                </label>
                <select id="filterArea">
                    <option value="all">All Areas</option>
                    <option value="customer-service">Customer Service</option>
                    <option value="data-migration">Data Migration</option>
                    <option value="process-optimization">Process Optimization</option>
                    <option value="sap-systems">SAP Systems</option>
                    <option value="automation">Automation</option>
                    <option value="analytics">Analytics</option>
                    <option value="real-estate">Real Estate</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filterStatus">
                    <i class="fas fa-list"></i> Status:
                </label>
                <select id="filterStatus">
                    <option value="all">All Status</option>
                    <option value="not-started">Not Started</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>
                    <i class="fas fa-star"></i>
                    <input type="checkbox" id="filterFavorites"> Favorites Only
                </label>
            </div>
            
            <button id="clearHistoryBtn" class="btn-danger-outline">
                <i class="fas fa-trash"></i> Clear All History
            </button>
        </div>
        
        <div id="historyContainer">
            <div id="historyList" class="history-list">
                <!-- History items will be loaded here -->
            </div>
            
            <div id="emptyState" class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>No Recommendations Yet</h3>
                <p>Start by creating your first AI-powered analysis</p>
                <a href="recommendations.html" class="btn-primary">
                    <i class="fas fa-plus-circle"></i> Create Analysis
                </a>
            </div>
        </div>
    </main>
    
    <!-- Details Modal -->
    <div id="detailsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Recommendation Details</h2>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button id="modalExport" class="btn-secondary">
                    <i class="fas fa-download"></i> Export
                </button>
                <button id="modalClose" class="btn-primary">Close</button>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
